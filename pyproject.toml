[project]
name = "comfyui-workflow-models-downloader"
description = "Scan workflows for required models and download them automatically from HuggingFace, CivitAI, and other sources. Features include filter dropdowns, Tavily AI-powered advanced search, metadata caching, and automatic URL restoration."
version = "1.9.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests",
    "huggingface_hub",
    "tavily-python",
    "aiohttp",
]

[project.urls]
Repository = "https://github.com/yezhangdeng01/ComfyUI-Workflow-Models-Downloader"
Documentation = "https://github.com/yezhangdeng01/ComfyUI-Workflow-Models-Downloader#readme"
"Bug Tracker" = "https://github.com/yezhangdeng01/ComfyUI-Workflow-Models-Downloader/issues"

[tool.comfy]
# NOTE: PublisherId 属于原发布者 slahiri 的 comfy.org 账号，无法在此更改。
# 本 fork 的实际代码与发布地址为 https://github.com/yezhangdeng01/ComfyUI-Workflow-Models-Downloader
PublisherId = "slahiri"
DisplayName = "Workflow Models Downloader"
Icon = "https://raw.githubusercontent.com/yezhangdeng01/ComfyUI-Workflow-Models-Downloader/main/images/workflow-models-tab.png"
