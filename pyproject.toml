[project]
name = "comfyui-workflow-model-manager"
description = "工作流模型管理 - 扫描工作流中引用的模型，自动从 HuggingFace、CivitAI 等来源解析并下载缺失模型，支持目录自动识别、来源校验与断点续传。"
version = "1.11.0"
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "huggingface_hub",
    "tavily-python",
    "aiohttp",
]

[project.urls]
Repository = "https://github.com/yezhangdeng01/ComfyUI-Workflow-Models-Downloader"
Documentation = "https://github.com/yezhangdeng01/ComfyUI-Workflow-Models-Downloader#readme"
"Bug Tracker" = "https://github.com/yezhangdeng01/ComfyUI-Workflow-Models-Downloader/issues"

[tool.comfy]
PublisherId = "yezhangdeng"
DisplayName = "工作流模型管理"
Icon = "https://raw.githubusercontent.com/yezhangdeng01/ComfyUI-Workflow-Models-Downloader/main/images/workflow-models-tab.png"
